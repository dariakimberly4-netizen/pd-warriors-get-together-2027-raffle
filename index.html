<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f2b"><link rel="manifest" href="manifest.json"><title>PD Warriors PH | Get Together 2027 Raffle</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fbf7ed;color:#183128}button,input,select{font:inherit}.top{background:#173f2b;color:white;padding:16px;text-align:center}.top b{font-size:21px}.top small{display:block;color:#f0d89a;margin-top:4px}.offline{background:#fff0c7;color:#5d4710;padding:9px;text-align:center;font-weight:800}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px}.stat{background:white;border:1px solid #eadfca;border-radius:16px;padding:10px 15px;min-width:100px;text-align:center}.stat strong{display:block;font-size:22px;color:#a51f2d}.home{min-height:620px;position:relative;max-width:620px;margin:auto}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:190px;height:190px;border-radius:50%;background:#173f2b;color:white;border:7px solid #caa552;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;box-shadow:0 12px 30px #0002}.center strong{font-size:25px}.orb{position:absolute;width:128px;height:76px;border-radius:40px;border:2px solid #caa552;background:white;color:#173f2b;font-weight:850;box-shadow:0 7px 16px #0001}.orb:active{transform:scale(.97)}.o1{left:50%;top:5%;transform:translateX(-50%)}.o2{right:3%;top:20%}.o3{right:1%;top:50%}.o4{right:10%;bottom:8%}.o5{left:10%;bottom:8%}.o6{left:1%;top:50%}.o7{left:3%;top:20%}.o8{left:50%;bottom:1%;transform:translateX(-50%)}.panel{display:none;position:fixed;inset:0;background:#fbf7ed;z-index:4;overflow:auto}.panel.show{display:block}.bar{position:sticky;top:0;background:#173f2b;color:white;padding:14px;display:flex;gap:10px;align-items:center;z-index:2}.back{background:white;color:#173f2b;border:0;border-radius:12px;padding:12px 16px;font-weight:800}.content{max-width:760px;margin:auto;padding:18px}.card{background:white;border:1px solid #eadfca;border-radius:20px;padding:18px;margin-bottom:14px}.big{width:100%;min-height:58px;border:0;border-radius:15px;background:#a51f2d;color:white;font-weight:900;font-size:19px;padding:12px}.green{background:#173f2b}.gold{background:#b88c25}.field{width:100%;padding:15px;border:2px solid #d9ceb9;border-radius:13px;margin:6px 0 12px;font-size:18px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.person{padding:13px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{border-radius:999px;padding:6px 10px;background:#e8f3ec;font-weight:800}.winner{text-align:center;padding:30px}.winner .num{font-size:62px;font-weight:950;color:#a51f2d}.winner h2{font-size:30px}.muted{color:#68736e}.new{outline:4px solid #f0c94d;animation:pulse 1.2s infinite}@keyframes pulse{50%{outline-color:transparent}}@media(max-width:520px){.home{min-height:570px}.center{width:155px;height:155px}.center strong{font-size:21px}.orb{width:110px;height:68px;font-size:13px}.o2{right:0}.o7{left:0}.o3{right:0}.o6{left:0}}
</style></head><body><header class="top"><b>PARKINSON'S DISEASE WARRIORS PHILIPPINES</b><small>GET TOGETHER 2027 • DIGITAL RAFFLE</small></header><div class="offline" id="net">✓ Offline-ready • Records saved on this device</div><div class="stats"><div class="stat"><strong id="sReg">0</strong>Registered</div><div class="stat"><strong id="sIn">0</strong>Checked In</div><div class="stat"><strong id="sWin">0</strong>Winners</div></div>
<main class="home"><button class="orb o1 new" data-p="checkin">✓ CHECK-IN</button><button class="orb o2" data-p="draw">🎟 DRAW</button><button class="orb o3" data-p="winners">🏆 WINNERS</button><button class="orb o4" data-p="prizes">🎁 PRIZES</button><button class="orb o5" data-p="attendees">👥 ATTENDEES</button><button class="orb o6" data-p="walkin">＋ WALK-IN</button><button class="orb o7" data-p="history">↺ HISTORY</button><button class="orb o8" data-p="reports">▤ REPORTS</button><div class="center"><div><strong>RAFFLE<br>2027</strong><br><small>Tap a module</small></div></div></main>
<div id="panels"></div><script>
const KEY='pdwph-raffle-2027-v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"attendees":[],"winners":[],"prizes":[],"history":[]}');
const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));stats()};const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stats(){sReg.textContent=db.attendees.length;sIn.textContent=db.attendees.filter(x=>x.in).length;sWin.textContent=db.winners.length}
function log(action){db.history.unshift({action,time:new Date().toLocaleString()});save()}
function shell(id,title,body){return '<section class="panel" id="'+id+'"><div class="bar"><button class="back" onclick="closeP()">← Orbit</button><b>'+title+'</b></div><div class="content">'+body+'</div></section>'}
function list(check=false){if(!db.attendees.length)return '<div class="card muted">No attendees yet. Add a walk-in to begin.</div>';return '<div class="card">'+db.attendees.map((a,i)=>'<div class="person"><div><b>#'+String(a.no).padStart(3,'0')+' '+esc(a.name)+'</b><br><small>'+(a.in?'✓ Checked in':'Not checked in')+(a.won?' • Winner':'')+'</small></div>'+(check?'<button class="back" onclick="toggleIn('+i+')">'+(a.in?'Undo':'Check In')+'</button>':'')+'</div>').join('')+'</div>'}
function render(id){let b='';if(id==='checkin')b='<input class="field" id="search" placeholder="Search attendee name or raffle number" oninput="renderSearch()"><div id="searchList">'+list(true)+'</div>';
if(id==='walkin')b='<div class="card"><label>Attendee name</label><input id="nm" class="field" placeholder="Full name"><button class="big green" onclick="add()">REGISTER & CHECK IN</button><p class="muted">A unique raffle number is assigned automatically and stored on this device.</p></div>';
if(id==='attendees')b=list(false);
if(id==='draw')b='<div class="card winner"><div class="muted">Eligible checked-in attendees</div><div class="num" id="drawNo">—</div><h2 id="drawName">Ready to draw</h2><button class="big" onclick="draw()">DRAW WINNER</button><div id="confirm"></div></div>';
if(id==='winners')b=db.winners.length?'<div class="card">'+db.winners.map(w=>'<div class="person"><b>🏆 #'+String(w.no).padStart(3,'0')+' '+esc(w.name)+'</b><span class="badge">'+esc(w.prize||'Winner')+'</span></div>').join('')+'</div>':'<div class="card muted">No winners yet.</div>';
if(id==='prizes')b='<div class="card"><input id="pr" class="field" placeholder="Prize name"><button class="big gold" onclick="addPrize()">ADD PRIZE</button></div><div class="card">'+(db.prizes.map((p,i)=>'<div class="person"><b>'+esc(p)+'</b><button class="back" onclick="db.prizes.splice('+i+',1);save();render(\'prizes\')">Remove</button></div>').join('')||'<span class="muted">No prizes added.</span>')+'</div>';
if(id==='history')b='<div class="card">'+(db.history.map(h=>'<div class="person"><span>'+esc(h.action)+'</span><small>'+esc(h.time)+'</small></div>').join('')||'<span class="muted">No activity yet.</span>')+'</div>';
if(id==='reports')b='<div class="card"><h2>Event Report</h2><p>Registered: <b>'+db.attendees.length+'</b><br>Checked in: <b>'+db.attendees.filter(x=>x.in).length+'</b><br>Winners: <b>'+db.winners.length+'</b></p><button class="big green" onclick="exportCSV()">DOWNLOAD CSV REPORT</button><br><br><button class="big gold" onclick="backup()">BACKUP DATA</button></div>';
panels.innerHTML=shell(id,id.toUpperCase().replace('-',' '),b);document.getElementById(id).classList.add('show')}
function closeP(){panels.innerHTML=''}document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>{x.classList.remove('new');render(x.dataset.p)});
function add(){let n=nm.value.trim();if(!n)return alert('Enter attendee name.');let no=db.attendees.reduce((m,x)=>Math.max(m,x.no),0)+1;db.attendees.push({no,name:n,in:true,won:false});log('Registered & checked in #'+no+' '+n);render('walkin')}
function toggleIn(i){db.attendees[i].in=!db.attendees[i].in;log((db.attendees[i].in?'Checked in ':'Undid check-in for ')+db.attendees[i].name);render('checkin')}
function renderSearch(){let q=search.value.toLowerCase();let inds=db.attendees.map((a,i)=>({a,i})).filter(x=>x.a.name.toLowerCase().includes(q)||String(x.a.no).includes(q));searchList.innerHTML='<div class="card">'+inds.map(x=>'<div class="person"><b>#'+String(x.a.no).padStart(3,'0')+' '+esc(x.a.name)+'</b><button class="back" onclick="toggleIn('+x.i+')">'+(x.a.in?'Undo':'Check In')+'</button></div>').join('')+'</div>'}
let pending=null;function draw(){let pool=db.attendees.filter(a=>a.in&&!a.won);if(!pool.length)return alert('No eligible checked-in attendees.');let spins=0,t=setInterval(()=>{let a=pool[Math.floor(Math.random()*pool.length)];drawNo.textContent='#'+String(a.no).padStart(3,'0');drawName.textContent=a.name;if(++spins>18){clearInterval(t);pending=a;confirm.innerHTML='<br><button class="big green" onclick="confirmWin()">CONFIRM WINNER</button>'}},80)}
function confirmWin(){if(!pending)return;let a=db.attendees.find(x=>x.no===pending.no);a.won=true;db.winners.push({no:a.no,name:a.name,prize:db.prizes[db.winners.length]||'Winner'});log('Winner #'+a.no+' '+a.name);pending=null;render('winners')}
function addPrize(){let v=pr.value.trim();if(v){db.prizes.push(v);log('Added prize: '+v);render('prizes')}}
function exportCSV(){let rows=[['Raffle No','Name','Checked In','Winner'],...db.attendees.map(a=>[a.no,a.name,a.in?'Yes':'No',a.won?'Yes':'No'])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');download(csv,'get-together-2027-raffle.csv','text/csv')}
function backup(){download(JSON.stringify(db,null,2),'get-together-2027-raffle-backup.json','application/json')}
function download(s,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click();URL.revokeObjectURL(a.href)}
function net(){document.getElementById('net').textContent=navigator.onLine?'✓ Online • Offline mode ready':'● OFFLINE • Raffle remains available'}addEventListener('online',net);addEventListener('offline',net);net();stats();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
